[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hector"
version = "0.1.0"
description = "FastAPI service skeleton for the Hector project"
readme = "Readme.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [ { name = "Half Baked Fully Nuts" } ]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "email-validator>=2.0,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "bcrypt>=4.0,<5.0",
  "PyJWT[crypto]>=2.9,<3",
  "python-multipart>=0.0.9,<1.0",
  "aiosmtplib>=5.1.1,<6",
  "pillow>=12.3.0,<13",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.9,<2",
  "pip-audit>=2.7,<3",
  "pre-commit>=3.5,<4",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=5,<7",
  "ruff>=0.4,<1",
]

[project.scripts]
hector = "hector.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
strict_equality = true
plugins = []
